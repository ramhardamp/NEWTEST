name: BSR Vault v6.7.9 Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BSR Vault v6.7.9 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          GRADLEW_PATH="$(find . -maxdepth 3 -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found."
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Static Android reference verification
        shell: bash
        run: |
          python3 "$PROJECT_DIR/tools/verify_android_refs.py"

      - name: Compile Kotlin
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK_COUNT="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No debug APK was produced."
            exit 1
          fi

          echo "APK produced:"
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BSR-Vault-v6.7.9-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Package source verification ZIP
        shell: bash
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/build-verification"
          git archive --format=zip --output="$PROJECT_DIR/build-verification/BSR-Vault-v6.7.9-Build-Ready.zip" HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BSR-Vault-v6.7.9-Build-Ready-Source
          path: '**/build-verification/BSR-Vault-v6.7.9-Build-Ready.zip'
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BSR-Vault-v6.7.9-build-reports
          path: |
            **/app/build/reports/**
            **/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
